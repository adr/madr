name: Check external href links

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/check-links.yml'
      - '**/*.md'
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: 'false'
      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          fail: true
          # npmjs.com returns 403 and just-the-docs returns 404 to the link checker's bot; accept those status codes
          args: --max-concurrency 1 --cache --no-progress --exclude-all-private --accept '200..=299,403,404' './**/*.md'
